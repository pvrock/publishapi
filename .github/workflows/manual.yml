name: Cherry-pick Commits and Raise PR

on:
  workflow_dispatch:
    inputs:
      story_numbers:
        description: 'List of story numbers to cherry-pick commits for (comma-separated)'
        required: true
      base_branch:
        description: 'Base branch to create cherry-pick branch from'
        required: true
      target_branch:
        description: 'Target branch to raise the Pull Request against'
        required: true

jobs:
  cherry-pick-and-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Create Branch
        run: |
          git checkout -b cherry-pick-branch ${{ github.event.inputs.base_branch }}

      - name: Cherry-pick Commits
        id: cherry-pick
        run: |
          # Parse input to get story numbers
          IFS=',' read -ra STORY_NUMBERS <<< "${{ github.event.inputs.story_numbers }}"

          # Loop through each story number and cherry-pick related commits
          for STORY_NUMBER in "${STORY_NUMBERS[@]}"; do
            echo story: $STORY_NUMBER
            git fetch origin
            COMMIT_HASH=$(git log --all --grep="${STORY_NUMBER}" --pretty=format:"%h")
            echo $(git log --all)
            echo commit: $COMMIT_HASH
            git cherry-pick $COMMIT_HASH || (
              echo "Conflict detected. Staging conflict markers."
              git add .  # Stage the conflict markers
              git commit -m "Cherry-pick commit ${COMMIT_HASH} for story ${STORY_NUMBER} with conflicts"
            )
          done

          # Push the changes back to the repository
          git add .
          git commit -m "Cherry-pick commits for stories: ${{ github.event.inputs.story_numbers }} with unresolved conflicts"
          git push origin cherry-pick-branch --force

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: cherry-pick-branch
          commit-message: 'Cherry-pick commits for stories: ${{ github.event.inputs.story_numbers }}'
          title: 'Cherry-pick commits for stories: ${{ github.event.inputs.story_numbers }}'
          body: |
            Cherry-picked commits for the following stories:
            ${{ github.event.inputs.story_numbers }}
            Note: Conflicts need to be resolved manually.
          labels: 'automated'
          target: ${{ github.event.inputs.target_branch }}  # Specify the target branch dynamically

