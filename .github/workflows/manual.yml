name: Cherry-pick and Create Pull Request

on:
  workflow_dispatch:
    inputs:
      story_number:
        description: 'Story number to cherry-pick commits for'
        required: true
      target_branch:
        description: 'Branch to create the PR against'
        required: true

jobs:
  cherry-pick-create-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Configure git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Create a new branch for cherry-picking
        run: |
          TARGET_BRANCH=${{ github.event.inputs.target_branch }}
          STORY_NUMBER=${{ github.event.inputs.story_number }}
          NEW_BRANCH="cherry-pick-${STORY_NUMBER}-to-${TARGET_BRANCH}"
          git checkout -b $NEW_BRANCH

      - name: Find and cherry-pick commits
        run: |
          STORY_NUMBER=${{ github.event.inputs.story_number }}
          COMMITS=$(git log --all --grep="feature/${STORY_NUMBER}" --pretty=format:"%h")
          for COMMIT in $COMMITS; do
            git cherry-pick $COMMIT || (git add . && git commit -m "Cherry-pick conflict resolution for $COMMIT")
          done

      - name: Check if there are changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            exit 0
          fi

      - name: Push changes
        run: |
          STORY_NUMBER=${{ github.event.inputs.story_number }}
          NEW_BRANCH="cherry-pick-${STORY_NUMBER}-to-${{ github.event.inputs.target_branch }}"
          git push origin $NEW_BRANCH

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Cherry-picked commits for feature/${{ github.event.inputs.story_number }}"
          branch: "cherry-pick-${{ github.event.inputs.story_number }}-to-${{ github.event.inputs.target_branch }}"
          base: ${{ github.event.inputs.target_branch }}
          title: "Cherry-picked PR for feature/${{ github.event.inputs.story_number }}"
          body: "This PR includes cherry-picked commits for feature/${{ github.event.inputs.story_number }}. Please resolve any conflicts."
          labels: automated-pr
