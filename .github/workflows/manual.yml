name: Cherry-pick and PR

on:
  workflow_dispatch:
    inputs:
      story:
        description: 'Story number to cherry-pick (e.g., HD-101)'
        required: true
      target_branch:
        description: 'Target branch to raise the PR against (e.g., main)'
        required: true

jobs:
  cherry-pick-and-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Git
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Fetch all branches
        run: git fetch --all

      - name: Cherry-pick commits
        run: |
          git checkout ${{ github.event.inputs.target_branch }}
          git pull origin ${{ github.event.inputs.target_branch }}
          git checkout -b cherry-pick-${{ github.event.inputs.story }}

          # Fetch commits from origin/test that match the story number and cherry-pick each commit
          git log origin/test --grep="${{ github.event.inputs.story }}" --format="%H" | xargs -I {} git cherry-pick {}

      - name: Push changes
        run: |
          git push origin cherry-pick-${{ github.event.inputs.story }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: cherry-pick-${{ github.event.inputs.story }}
          title: Cherry-pick ${{
            github.event.inputs.story }} commits to ${{ github.event.inputs.target_branch }}
          body: |
            This PR includes cherry-picked commits from test branch with ${
              { github.event.inputs.story }}.
          base: ${{ github.event.inputs.target_branch }}
