name: Cherry-pick Commits and Raise PR

on:
  workflow_dispatch:
    inputs:
      story_numbers:
        description: 'List of story numbers to cherry-pick commits for (comma-separated)'
        required: true
      base_branch:
        description: 'Base branch to create cherry-pick branch from'
        required: true
      target_branch:
        description: 'Target branch to raise the Pull Request against'
        required: true

jobs:
  cherry-pick-and-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Create a new branch for cherry-picking
        run: |
          TARGET_BRANCH=${{ github.event.inputs.target_branch }}
          BASE_BRANCH=${{ github.event.inputs.base_branch }}
          NEW_BRANCH="cherry-pick-to-${TARGET_BRANCH}"
          git checkout -b $NEW_BRANCH origin/$BASE_BRANCH

      - name: Cherry-pick Commits
        id: cherry-pick
        run: |
          STORY_NUMBERS=${{ github.event.inputs.story_numbers }}
          IFS=',' read -ra STORY_ARRAY <<< "$STORY_NUMBERS"

          for STORY_NUMBER in "${STORY_ARRAY[@]}"; do
            echo "Processing story number: $STORY_NUMBER"
            COMMITS=$(git log --all --grep="${STORY_NUMBER}" --pretty=format:"%h")
            for COMMIT in $COMMITS; do
              echo "Cherry-picking commit: $COMMIT"
              git cherry-pick $COMMIT || (git add . && git commit -m "Conflict resolution for $COMMIT" && git cherry-pick --continue || git cherry-pick --skip)
            done
          done

      - name: Push changes
        run: |
          NEW_BRANCH="cherry-pick-to-${{ github.event.inputs.target_branch }}"
          git push origin $NEW_BRANCH

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'Cherry-pick commits for stories: ${{ github.event.inputs.story_numbers }}'
          branch: "cherry-pick-to-${{ github.event.inputs.target_branch }}"
          base: ${{ github.event.inputs.target_branch }}
          title: 'Cherry-pick commits for stories: ${{ github.event.inputs.story_numbers }}'
          body: |
            Cherry-picked commits for the following stories:
            ${{ github.event.inputs.story_numbers }}
            Note: Conflicts need to be resolved manually.
          labels: 'automated'
