name: Cherry-pick and Create Pull Request

on:
  workflow_dispatch:
    inputs:
      story_numbers:
        description: 'Comma-separated list of story numbers to cherry-pick commits for (e.g., HD-102,HD-103) v2'
        required: true
      target_branch:
        description: 'Branch to create the PR against'
        required: true
      base_branch:
        description: 'Branch to base the new branch on (e.g., main, test)'
        required: true

jobs:
  cherry-pick-create-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Configure git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Create a new branch for cherry-picking
        run: |
          TARGET_BRANCH=${{ github.event.inputs.target_branch }}
          BASE_BRANCH=${{ github.event.inputs.base_branch }}
          NEW_BRANCH="cherry-pick-to-${TARGET_BRANCH}"
          git checkout -b $NEW_BRANCH origin/$BASE_BRANCH

      - name: Find and cherry-pick commits
        run: |
          STORY_NUMBERS=${{ github.event.inputs.story_numbers }}
          IFS=',' read -ra STORY_ARRAY <<< "$STORY_NUMBERS"
          for STORY_NUMBER in "${STORY_ARRAY[@]}"; do
            echo "Processing story number: $STORY_NUMBER"
            COMMITS=$(git log --all --grep="${STORY_NUMBER}" --pretty=format:"%h")
            echo "Processing story number: $(git log --all)"
            if [ -z "$COMMITS" ]; then
              echo "No commits found for story number: $STORY_NUMBER"
            else
              for COMMIT in $COMMITS; do
                echo "Cherry-picking commit: $COMMIT"
                git cherry-pick $COMMIT || (git add . && git commit -m "Cherry-pick conflict resolution for $COMMIT")
              done
            fi
          done

      - name: Check if there are changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            exit 0
          fi

      - name: Push changes
        run: |
          NEW_BRANCH="cherry-pick-to-${{ github.event.inputs.target_branch }}"
          git push origin $NEW_BRANCH

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Cherry-picked commits for ${{ github.event.inputs.story_numbers }}"
          branch: "cherry-pick-to-${{ github.event.inputs.target_branch }}"
          base: ${{ github.event.inputs.base_branch }}
          title: "Cherry-picked PR for ${{ github.event.inputs.story_numbers }}"
          body: "This PR includes cherry-picked commits for ${{ github.event.inputs.story_numbers }}. Please resolve any conflicts."
          labels: automated-pr
